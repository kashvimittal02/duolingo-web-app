<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sleepBodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#72dc0a" />
      <stop offset="100%" stop-color="#58cc02" />
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="168" rx="46" ry="8" fill="#cbd5e1" opacity="0.8" />

  <!-- Left Ear (Rounded Capsule) -->
  <g transform="rotate(-18 64 48)">
    <rect x="54" y="26" width="20" height="34" rx="10" fill="#58cc02" stroke="#3c9a00" stroke-width="4.5" />
    <rect x="58" y="32" width="12" height="22" rx="6" fill="#ff9fb3" />
  </g>

  <!-- Right Ear (Rounded Capsule) -->
  <g transform="rotate(18 136 48)">
    <rect x="126" y="26" width="20" height="34" rx="10" fill="#58cc02" stroke="#3c9a00" stroke-width="4.5" />
    <rect x="130" y="32" width="12" height="22" rx="6" fill="#ff9fb3" />
  </g>

  <!-- Floating Sleeping Zs above right ear -->
  <text x="142" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#38bdf8">z</text>
  <text x="154" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#38bdf8">Z</text>
  <text x="166" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#38bdf8">z</text>

  <!-- Main Round Head/Body -->
  <circle cx="100" cy="106" r="52" fill="url(#sleepBodyGrad)" stroke="#3c9a00" stroke-width="5" />

  <!-- Inner Belly / Chin Patch -->
  <ellipse cx="100" cy="118" rx="38" ry="32" fill="#f4fae1" stroke="#58cc02" stroke-width="2.5" />

  <!-- Golden Collar -->
  <path d="M 62 130 C 74 150 126 150 138 130 C 132 144 116 152 100 152 C 84 152 68 144 62 130 Z" fill="#ff9600" stroke="#d97706" stroke-width="3.5" stroke-linejoin="round" />

  <!-- White Pendant Tag -->
  <circle cx="100" cy="144" r="6.5" fill="#ffffff" stroke="#d97706" stroke-width="2" />

  <!-- Pink Cheek Blushes -->
  <ellipse cx="69" cy="110" rx="7.5" ry="4.5" fill="#ff9fb3" opacity="0.9" />
  <ellipse cx="131" cy="110" rx="7.5" ry="4.5" fill="#ff9fb3" opacity="0.9" />

  <!-- Closed Peaceful Sleeping Eyes -->
  <path d="M 74 94 Q 84 102 94 94" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
  <path d="M 106 94 Q 116 102 126 94" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />

  <!-- Cute Nose -->
  <ellipse cx="100" cy="98" rx="3" ry="2" fill="#1e293b" />

  <!-- Calm Little Smile -->
  <path d="M 94 105 Q 100 110 106 105" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
</svg>
