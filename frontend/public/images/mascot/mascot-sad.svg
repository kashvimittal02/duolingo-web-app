<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sadBodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#72dc0a" />
      <stop offset="100%" stop-color="#58cc02" />
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="168" rx="46" ry="8" fill="#cbd5e1" opacity="0.8" />

  <!-- Left Drooped Ear (Pointing downwards/sideways) -->
  <g transform="rotate(-65 52 92)">
    <rect x="42" y="74" width="20" height="34" rx="10" fill="#58cc02" stroke="#3c9a00" stroke-width="4.5" />
    <rect x="46" y="80" width="12" height="22" rx="6" fill="#ff9fb3" />
  </g>

  <!-- Right Drooped Ear (Pointing downwards/sideways) -->
  <g transform="rotate(65 148 92)">
    <rect x="138" y="74" width="20" height="34" rx="10" fill="#58cc02" stroke="#3c9a00" stroke-width="4.5" />
    <rect x="142" y="80" width="12" height="22" rx="6" fill="#ff9fb3" />
  </g>

  <!-- Main Round Head/Body -->
  <circle cx="100" cy="106" r="52" fill="url(#sadBodyGrad)" stroke="#3c9a00" stroke-width="5" />

  <!-- Inner Belly / Chin Patch -->
  <ellipse cx="100" cy="118" rx="38" ry="32" fill="#f4fae1" stroke="#58cc02" stroke-width="2.5" />

  <!-- Golden Collar -->
  <path d="M 62 130 C 74 150 126 150 138 130 C 132 144 116 152 100 152 C 84 152 68 144 62 130 Z" fill="#ff9600" stroke="#d97706" stroke-width="3.5" stroke-linejoin="round" />

  <!-- White Pendant Tag -->
  <circle cx="100" cy="144" r="6.5" fill="#ffffff" stroke="#d97706" stroke-width="2" />

  <!-- Pink Cheek Blushes -->
  <ellipse cx="69" cy="110" rx="7.5" ry="4.5" fill="#ff9fb3" opacity="0.9" />
  <ellipse cx="131" cy="110" rx="7.5" ry="4.5" fill="#ff9fb3" opacity="0.9" />

  <!-- Frowning Slanted Eyebrows -->
  <path d="M 72 82 Q 82 87 92 85" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 108 85 Q 118 87 128 82" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />

  <!-- Sad Eyes -->
  <circle cx="82" cy="94" r="6" fill="#1e293b" />
  <circle cx="80" cy="92" r="2" fill="#ffffff" />

  <circle cx="118" cy="94" r="6" fill="#1e293b" />
  <circle cx="116" cy="92" r="2" fill="#ffffff" />

  <!-- Blue Teardrop on Right Cheek -->
  <path d="M 132 99 C 132 96 135 92 135 92 C 135 92 138 96 138 99 C 138 101.5 136.5 103 135 103 C 133.5 103 132 101.5 132 99 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />

  <!-- Cute Nose -->
  <ellipse cx="100" cy="99" rx="3" ry="2" fill="#1e293b" />

  <!-- Downward Frown Mouth -->
  <path d="M 92 112 Q 100 104 108 112" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
</svg>
