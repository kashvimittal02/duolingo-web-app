<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="cpGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cpStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <!-- Background Glow & Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#cpGlow)" />
  <circle cx="50" cy="50" r="44" fill="url(#cpStone)" stroke="#991b1b" stroke-width="4" />

  <!-- Fortress / Castle Silhouette -->
  <!-- Left Tower -->
  <rect x="24" y="32" width="14" height="42" fill="#ffffff" stroke="#7f1d1d" stroke-width="2.5" />
  <polygon points="22,32 31,18 40,32" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  <!-- Left Flag -->
  <polygon points="31,18 31,12 40,15 31,18" fill="#ef4444" />

  <!-- Right Tower -->
  <rect x="62" y="32" width="14" height="42" fill="#ffffff" stroke="#7f1d1d" stroke-width="2.5" />
  <polygon points="60,32 69,18 78,32" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  <!-- Right Flag -->
  <polygon points="69,18 69,12 78,15 69,18" fill="#ef4444" />

  <!-- Center Fortress Wall -->
  <rect x="36" y="44" width="28" height="30" fill="#ffffff" stroke="#7f1d1d" stroke-width="2.5" />
  <!-- Battlements -->
  <rect x="38" y="40" width="6" height="6" fill="#ffffff" stroke="#7f1d1d" stroke-width="2" />
  <rect x="47" y="40" width="6" height="6" fill="#ffffff" stroke="#7f1d1d" stroke-width="2" />
  <rect x="56" y="40" width="6" height="6" fill="#ffffff" stroke="#7f1d1d" stroke-width="2" />

  <!-- Arch Gate Entry -->
  <path d="M 44 74 L 44 58 C 44 53 56 53 56 58 L 56 74 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="2" />

  <!-- Golden Lock / Crest on Gate -->
  <circle cx="50" cy="52" r="3.5" fill="#facc15" stroke="#a16207" stroke-width="1.5" />
</svg>
